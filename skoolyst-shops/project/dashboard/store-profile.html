<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Profile — Skoolyst Stores Dashboard</title>
  <meta name="description" content="Manage your store profile on Skoolyst Stores.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="dashboard-body">

<div class="dashboard-layout">
  <aside class="dashboard-sidebar" id="dashSidebar">
    <div class="sidebar-brand">Skoolyst<span class="brand-accent">Stores</span></div>
    <nav>
      <div class="nav-section-label">Main</div>
      <a class="nav-link" href="index.html"><i class="bi bi-speedometer2"></i> Overview</a>
      <a class="nav-link active" href="store-profile.html"><i class="bi bi-shop"></i> Store Profile</a>
      <a class="nav-link" href="products.html"><i class="bi bi-box-seam"></i> Products</a>
      <a class="nav-link" href="add-product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
      <div class="nav-section-label">Sales</div>
      <a class="nav-link" href="orders.html"><i class="bi bi-bag-check"></i> Orders</a>
      <a class="nav-link" href="customers.html"><i class="bi bi-people"></i> Customers</a>
      <a class="nav-link" href="analytics.html"><i class="bi bi-graph-up"></i> Analytics</a>
      <div class="nav-section-label">Account</div>
      <a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
      <a class="nav-link" href="../login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </nav>
  </aside>
  <div class="sidebar-overlay"></div>

  <div class="dashboard-main">
    <div class="dashboard-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" data-sidebar-toggle><i class="bi bi-list"></i></button>
        <h1 class="topbar-title">Store Profile</h1>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="dropdown"><button class="btn btn-sm btn-light-navy dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle me-1"></i> Store Owner</button>
          <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Settings</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="../login.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li></ul>
        </div>
      </div>
    </div>

    <div class="dashboard-content">
      <form data-validate>
        <!-- Store Information -->
        <div class="form-card">
          <div class="form-card-title"><i class="bi bi-shop text-navy me-1"></i> Store Information</div>
          <div class="row g-3">
            <div class="col-md-8"><label class="form-label" for="sName">Store Name</label><input type="text" class="form-control" id="sName" name="storeName" required value="Student Essentials"></div>
            <div class="col-md-4"><label class="form-label" for="sEst">Established</label><input type="text" class="form-control" id="sEst" name="established" value="2019"></div>
            <div class="col-12"><label class="form-label" for="sDesc">Store Description</label><textarea class="form-control" id="sDesc" name="storeDescription" rows="3">Your trusted destination for school uniforms, bags, stationery and everyday educational supplies.</textarea></div>
          </div>
          <hr class="my-3">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Store Logo</label><div class="d-flex align-items-center gap-3"><div class="store-logo-wrap" style="width:64px;height:64px;border-radius:12px;border:2px solid var(--sk-border)"><img src="https://images.pexels.com/photos/5212320/pexels-photo-5212320.jpeg?auto=compress&cs=tinysrgb&w=200" alt="Store logo"></div><button type="button" class="btn btn-sm btn-outline-navy">Change Logo</button></div></div>
            <div class="col-md-6"><label class="form-label">Cover Image</label><div class="upload-area" style="padding:1.5rem"><div class="upload-icon" style="font-size:1.5rem"><i class="bi bi-image"></i></div><p class="small mb-0">Click to upload cover image</p></div></div>
          </div>
        </div>

        <!-- Contact -->
        <div class="form-card">
          <div class="form-card-title"><i class="bi bi-telephone-fill text-navy me-1"></i> Contact</div>
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label" for="sPhone">Phone</label><input type="tel" class="form-control" id="sPhone" name="phone" required value="+92 42 111 222 333"></div>
            <div class="col-md-4"><label class="form-label" for="sEmail">Email</label><input type="email" class="form-control" id="sEmail" name="email" required value="info@studentessentials.pk"></div>
            <div class="col-md-4"><label class="form-label" for="sWeb">Website</label><input type="url" class="form-control" id="sWeb" name="website" placeholder="https://..."></div>
          </div>
        </div>

        <!-- Location -->
        <div class="form-card">
          <div class="form-card-title"><i class="bi bi-geo-alt-fill text-navy me-1"></i> Location</div>
          <div class="row g-3">
            <div class="col-12"><label class="form-label" for="sAddr">Address</label><input type="text" class="form-control" id="sAddr" name="address" required value="Main Boulevard, Gulberg III"></div>
            <div class="col-md-4"><label class="form-label" for="sCity">City</label><select class="form-select" id="sCity" name="city" required><option>Lahore</option><option>Karachi</option><option>Islamabad</option><option>Rawalpindi</option><option>Hyderabad</option><option>Faisalabad</option><option>Multan</option><option>Peshawar</option></select></div>
            <div class="col-md-4"><label class="form-label" for="sArea">Area</label><input type="text" class="form-control" id="sArea" name="area" value="Gulberg III"></div>
            <div class="col-md-4"><label class="form-label" for="sPostal">Postal Code</label><input type="text" class="form-control" id="sPostal" name="postalCode" value="54600"></div>
          </div>
        </div>

        <!-- Business Info -->
        <div class="form-card">
          <div class="form-card-title"><i class="bi bi-building-fill text-navy me-1"></i> Business Information</div>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="sCat">Store Category</label><select class="form-select" id="sCat" name="storeCategory"><option>School Supplies</option><option>Uniforms</option><option>Books</option><option>Stationery</option><option>Shoes</option><option>Bags</option></select></div>
            <div class="col-md-6"><label class="form-label" for="sType">Store Type</label><select class="form-select" id="sType" name="storeType"><option>Retail Store</option><option>Wholesale</option><option>Brand Outlet</option></select></div>
            <div class="col-md-6"><label class="form-label" for="sOpen">Opening Time</label><input type="time" class="form-control" id="sOpen" name="openingTime" value="09:00"></div>
            <div class="col-md-6"><label class="form-label" for="sClose">Closing Time</label><input type="time" class="form-control" id="sClose" name="closingTime" value="20:00"></div>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-4">
          <button type="submit" class="btn btn-navy"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
